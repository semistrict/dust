services:
  # ============================================================================
  # Infrastructure
  # ============================================================================

  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    volumes:
      - pgsql:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:14.1-alpine
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        for dbname in dust_api dust_front dust_connectors dust_oauth; do
          echo "Creating database $$dbname (if not exists)..."
          psql "postgres://dev:dev@db:5432/postgres" -tc \
            "SELECT 1 FROM pg_database WHERE datname = '$$dbname';" \
            | grep -q 1 \
            || psql "postgres://dev:dev@db:5432/postgres" -c "CREATE DATABASE $$dbname;"
        done
        echo "All databases ready."

  qdrant:
    image: "qdrant/qdrant:v1.13.0"
    volumes:
      - qdrant:/qdrant/storage
    ports:
      - "6334:6334"
      - "6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: "dummy"
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    healthcheck:
      test: ["CMD-SHELL", "sleep 5"] # curl not available in qdrant image
      interval: 1s
      timeout: 10s
      retries: 1

  redis:
    image: redis
    ports:
      - 6379:6379
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lfu
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  apache-tika:
    image: apache/tika:2.9.2.1-full
    ports:
      - "9998:9998"

  elasticsearch:
    build:
      context: .
      dockerfile: elasticsearch.Dockerfile
      network: host
      args:
        ES_VERSION: ${ES_LOCAL_VERSION}
    container_name: ${ES_LOCAL_CONTAINER_NAME:-dust-elasticsearch}
    volumes:
      - dev-elasticsearch:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - xpack.ml.use_auto_machine_memory_percent=true
      - ES_JAVA_OPTS=-Xms${ES_LOCAL_HEAP_INIT:-512m} -Xmx${ES_LOCAL_HEAP_MAX:-512m}
      - action.auto_create_index=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --output /dev/null --silent --head --fail -u elastic:${ELASTICSEARCH_PASSWORD} http://elasticsearch:${ES_LOCAL_PORT:-9200}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=dev
      - POSTGRES_PWD=dev
      - POSTGRES_SEEDS=db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ============================================================================
  # Kibana (optional — comment out if not needed)
  # ============================================================================

  kibana_settings:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_LOCAL_VERSION}
    container_name: kibana_settings
    restart: "no"
    profiles: ["kibana"]
    command: >
      bash -c '
        echo "Setup the kibana_system password";
        until curl -s -u "elastic:${ELASTICSEARCH_PASSWORD}" -X POST http://elasticsearch:${ES_LOCAL_PORT:-9200}/_security/user/kibana_system/_password -d "{\"password\":\"'${KIBANA_LOCAL_PASSWORD}'\"}" -H "Content-Type: application/json" | grep -q "^{}"; do sleep 5; done;
      '

  kibana:
    depends_on:
      kibana_settings:
        condition: service_completed_successfully
    image: docker.elastic.co/kibana/kibana:${ES_LOCAL_VERSION}
    container_name: ${KIBANA_LOCAL_CONTAINER_NAME:-dust-kibana}
    volumes:
      - dev-kibana:/usr/share/kibana/data
    ports:
      - 127.0.0.1:${KIBANA_LOCAL_PORT:-5601}:5601
    profiles: ["kibana"]
    environment:
      - SERVER_NAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_LOCAL_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - ELASTICSEARCH_PUBLICBASEURL=http://localhost:${ES_LOCAL_PORT:-9200}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://kibana:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 20

  fake-workos:
    build:
      context: ./fake-workos
    restart: unless-stopped
    ports:
      - "7600:7600"
    environment:
      - PORT=7600
      - COOKIE_PASSWORD=${WORKOS_COOKIE_PASSWORD:-change-me-to-32-char-password-xx}
      - BASE_URL=http://fake-workos:7600
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:7600/.well-known/jwks.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # Application services
  # ============================================================================

  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - CORE_PORT=3001
      - CORE_DATABASE_URI=postgres://dev:dev@db:5432/dust_api
      - CORE_DATABASE_READ_REPLICA_URI=postgres://dev:dev@db:5432/dust_api
      - OAUTH_DATABASE_URI=postgres://dev:dev@db:5432/dust_oauth
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - QDRANT_CLUSTER_0_URL=http://qdrant:6334
      - QDRANT_CLUSTER_0_API_KEY=dummy
      - QDRANT_USE_SHARDING=false
      - DUST_DIR=/dust-data
      - IS_LOCAL_DEV=true
    volumes:
      - core-dust-data:/dust-data
    depends_on:
      db-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  sqlite-worker:
    build:
      context: .
      dockerfile: Dockerfile.core
      args:
        BIN_NAME: sqlite-worker
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file: .env
    environment:
      - IS_LOCAL_DEV=true
      - CORE_API=http://core:3001
      - CORE_API_KEY=${CORE_API_KEY:-}
    depends_on:
      - core

  oauth:
    build:
      context: .
      dockerfile: Dockerfile.core
      args:
        BIN_NAME: oauth
    restart: unless-stopped
    ports:
      - "3006:3006"
    env_file: .env
    environment:
      - OAUTH_PORT=3006
      - OAUTH_DATABASE_URI=postgres://dev:dev@db:5432/dust_oauth
    depends_on:
      db-init:
        condition: service_completed_successfully

  front-init:
    build:
      context: .
      dockerfile: Dockerfile.front
      args:
        TARGET: initdb
    restart: "no"
    env_file: .env
    environment:
      - NODE_ENV=development
      - FRONT_DATABASE_URI=postgres://dev:dev@db:5432/dust_front
      - FRONT_DATABASE_READ_REPLICA_URI=postgres://dev:dev@db:5432/dust_front
      - REDIS_URI=redis://redis:6379
      - REDIS_CACHE_URI=redis://redis:6379
      - CORE_API=http://core:3001
      - CONNECTORS_API=http://connectors:3002
      - OAUTH_API=http://oauth:3006
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - ALLOW_UNSAFE_INITDB=true
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  front:
    build:
      context: .
      dockerfile: Dockerfile.front
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=development
      - IS_DEVELOPMENT=true
      - DUST_DISABLE_PAYWALL=true
      - PORT=3000
      - WORKOS_API_HOSTNAME=fake-workos:7600
      - WORKOS_AUTHORIZE_HOSTNAME=localhost:7600
      - WORKOS_API_KEY=fake-api-key
      - WORKOS_CLIENT_ID=fake-client-id
      - WORKOS_COOKIE_PASSWORD=change-me-to-32-char-password-xx
      - WORKOS_ISSUER_URL=http://fake-workos:7600
      - WORKOS_WEBHOOK_SECRET=fake-webhook-secret
      - WORKOS_WEBHOOK_SIGNING_SECRET=fake-webhook-signing-secret
      - WORKOS_ACTION_SECRET=fake-action-secret
      - WORKOS_ACTION_SIGNING_SECRET=fake-action-signing-secret
      - WORKOS_ENVIRONMENT_ID=fake-env-id
      - REGION=us-central1
      - CORE_API=http://core:3001
      - CONNECTORS_API=http://connectors:3002
      - OAUTH_API=http://oauth:3006
      - DUST_FRONT_API=http://front:3000
      - DUST_FRONT_INTERNAL_API=http://front:3000
      - FRONT_DATABASE_URI=postgres://dev:dev@db:5432/dust_front
      - FRONT_DATABASE_READ_REPLICA_URI=postgres://dev:dev@db:5432/dust_front
      - REDIS_URI=redis://redis:6379
      - REDIS_CACHE_URI=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - TEXT_EXTRACTION_URL=http://apache-tika:9998
      - TEMPORAL_ADDRESS=temporal:7233
      - NOVU_SECRET_KEY=fake-novu-key
      - DUST_INVITE_TOKEN_SECRET=change-me-to-random-secret-1234
      - DUST_REGISTRY_SECRET=change-me-to-random-secret-1234
      - DUST_CONNECTORS_SECRET=change-me-to-random-secret-1234
      - DUST_CONNECTORS_WEBHOOKS_SECRET=change-me-to-random-secret
      - VIZ_JWT_SECRET=change-me-to-random-secret-1234
      - DUST_ACADEMY_JWT_SECRET=change-me-to-random-secret
      - DUST_SANDBOX_JWT_SECRET=change-me-to-random-secret
      - EMAIL_WEBHOOK_SECRET=change-me-to-random-secret
      - EMAIL_VALIDATION_SECRET=change-me-to-random-secret
      - GATED_ASSETS_TOKEN_SECRET=change-me-to-random-secret
      - DUST_DEVELOPERS_SECRETS_SECRET=change-me-to-random-secret
      - DUST_MCP_SERVER_CREDENTIALS_SECRET=change-me-to-random
      - DUST_DEVELOPMENT_SYSTEM_API_KEY=change-me-to-random
      - DUST_DEVELOPMENT_WORKSPACE_ID=dev-workspace
      - GOOGLE_CLOUD_PROJECT_ID=fake-project
      - POKE_APP_URL=http://localhost:3000/poke
      - VIZ_PUBLIC_URL=http://localhost:3100
      - NEXT_PUBLIC_VIZ_URL=http://localhost:3100
      - NEXT_PUBLIC_DUST_CLIENT_FACING_URL=http://localhost:3000
      - NEXT_PUBLIC_DUST_APP_URL=http://localhost:3011
      - DUST_AUTH_REDIRECT_BASE_URL=http://localhost:3000
      - DUST_CLIENT_FACING_URL=http://localhost:3000
    depends_on:
      front-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      fake-workos:
        condition: service_healthy

  front-workers:
    build:
      context: .
      dockerfile: Dockerfile.front
      args:
        TARGET: worker
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - CORE_API=http://core:3001
      - CONNECTORS_API=http://connectors:3002
      - OAUTH_API=http://oauth:3006
      - DUST_FRONT_API=http://front:3000
      - DUST_FRONT_INTERNAL_API=http://front:3000
      - FRONT_DATABASE_URI=postgres://dev:dev@db:5432/dust_front
      - FRONT_DATABASE_READ_REPLICA_URI=postgres://dev:dev@db:5432/dust_front
      - REDIS_URI=redis://redis:6379
      - REDIS_CACHE_URI=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - TEXT_EXTRACTION_URL=http://apache-tika:9998
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - front
      - temporal

  connectors:
    build:
      context: .
      dockerfile: Dockerfile.connectors
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      - NODE_ENV=development
      - CONNECTORS_DATABASE_URI=postgres://dev:dev@db:5432/dust_connectors
      - CONNECTORS_DATABASE_READ_REPLICA_URI=postgres://dev:dev@db:5432/dust_connectors
      - CONNECTORS_PUBLIC_URL=http://localhost:3002
      - DUST_FRONT_API=http://front:3000
      - DUST_FRONT_INTERNAL_API=http://front:3000
      - DUST_CLIENT_FACING_URL=http://localhost:3000
      - OAUTH_API=http://oauth:3006
      - TEXT_EXTRACTION_URL=http://apache-tika:9998
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      db-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

  connectors-worker:
    build:
      context: .
      dockerfile: Dockerfile.connectors
      args:
        TARGET: worker
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - CONNECTORS_DATABASE_URI=postgres://dev:dev@db:5432/dust_connectors
      - CONNECTORS_DATABASE_READ_REPLICA_URI=postgres://dev:dev@db:5432/dust_connectors
      - CONNECTORS_PUBLIC_URL=http://localhost:3002
      - DUST_FRONT_API=http://front:3000
      - DUST_FRONT_INTERNAL_API=http://front:3000
      - DUST_CLIENT_FACING_URL=http://localhost:3000
      - OAUTH_API=http://oauth:3006
      - TEXT_EXTRACTION_URL=http://apache-tika:9998
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - connectors
      - temporal

  front-spa:
    build:
      context: .
      dockerfile: Dockerfile.front-spa
    restart: unless-stopped
    ports:
      - "3011:3011"
    depends_on:
      - front

  viz:
    build:
      context: .
      dockerfile: Dockerfile.viz
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
    depends_on:
      - front

volumes:
  pgsql:
  qdrant:
  dev-elasticsearch:
  dev-kibana:
  core-dust-data:
